name: release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build extension
        run: npx vici build -o dist

      # tar from inside dist/ so the archive contents sit at the root and unpack
      # directly into a target dir (e.g. tar -xzf ... -C <target>).
      - name: Package extension
        id: package
        run: |
          set -euo pipefail
          EXT_DIR="$GITHUB_WORKSPACE/dist"
          TARBALL="maitri-vicinae-extension.tar.gz"
          tar -czf "$GITHUB_WORKSPACE/$TARBALL" -C "$EXT_DIR" .
          cd "$GITHUB_WORKSPACE"
          sha256sum "$TARBALL" > "$TARBALL.sha256"
          echo "Packaged:"
          ls -la "$TARBALL" "$TARBALL.sha256"
          cat "$TARBALL.sha256"

      - name: Attest extension build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: maitri-vicinae-extension.tar.gz

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            maitri-vicinae-extension.tar.gz
            maitri-vicinae-extension.tar.gz.sha256
