name: release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build extension
        run: npx vici build -o dist

      # tar from inside dist/ so the archive contents sit at the root and unpack
      # directly into a target dir (e.g. tar -xzf ... -C <target>).
      - name: Package extension
        id: package
        run: |
          set -euo pipefail
          EXT_DIR="$GITHUB_WORKSPACE/dist"
          TARBALL="maitri-vicinae-extension.tar.gz"
          # Workaround: vici build >= 0.29 stages into a mkdtemp dir (mode 0700) and
          # renames it to dist/. The archive's ./ entry carries that mode onto the
          # extract target, and makepkg extracts as fakeroot, so the packaged
          # /usr/share/maitri/vicinae-extension would end up unreadable by users.
          chmod 0755 "$EXT_DIR"
          tar -czf "$GITHUB_WORKSPACE/$TARBALL" -C "$EXT_DIR" .
          cd "$GITHUB_WORKSPACE"
          sha256sum "$TARBALL" > "$TARBALL.sha256"
          echo "Packaged:"
          ls -la "$TARBALL" "$TARBALL.sha256"
          cat "$TARBALL.sha256"

      - name: Attest extension build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: maitri-vicinae-extension.tar.gz

      - name: Upload release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            maitri-vicinae-extension.tar.gz
            maitri-vicinae-extension.tar.gz.sha256
